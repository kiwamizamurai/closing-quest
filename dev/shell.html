<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closing Quest - shell harness</title>
    <style>
      /* 開発用ハーネス: 下に操作バーを置き、その分だけアプリの表示域を縮める */
      body #app {
        bottom: 116px;
      }
      #backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, #b98a5b, #6b4a2f 70%, #3b2a1c);
      }
      #backdrop::after {
        /* 机の上の白い紙（3D の明るい部分の代役。文字の読みやすさを最悪ケースで確かめる） */
        content: '';
        position: absolute;
        left: 30%;
        top: 22%;
        width: 40%;
        height: 50%;
        background: #f6f1e4;
        transform: rotate(-3deg);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      body[data-bg='light'] #backdrop {
        background: #f4efe4;
      }
      body[data-bg='light'] #backdrop::after {
        display: none;
      }
      #devbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 116px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        gap: 6px;
        padding: 6px 10px;
        background: #0c0d11;
        color: #cfd3de;
        font: 13px/1.3 system-ui, sans-serif;
        border-top: 1px solid #333;
      }
      #devbar button {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #22252e;
        color: #eee;
        font: inherit;
        cursor: pointer;
      }
      #devbar button:hover {
        background: #333844;
      }
      #devbar .sep {
        width: 1px;
        background: #444;
        margin: 0 4px;
      }
      #devbar label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .mock-card {
        position: absolute;
        top: var(--hud-h);
        right: 0;
        bottom: 0;
        z-index: 15;
        width: var(--panel-w);
        padding: 20px;
        background: var(--paper);
        color: var(--ink);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow-panel);
        pointer-events: auto;
      }
      .mock-card[hidden] {
        display: none;
      }
    </style>
  </head>
  <body data-bg="desk">
    <div id="app">
      <div id="backdrop"></div>
      <div id="ui"></div>
      <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    </div>
    <div id="devbar"></div>
    <script type="module" src="/src/dev/shellHarness.ts"></script>
  </body>
</html>
